<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline';">
  <title>Typeless HUD</title>
  <style>
    /* ── Reset & base ─────────────────────────────────────────────── */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --a:    #3D8EFF;   /* blue   — dictate */
      --g:    #00D68F;   /* green  — done    */
      --r:    #FF4757;   /* red    — error   */
      --am:   #FFB627;   /* amber  — plan    */
      --p:    #A855F7;   /* purple — exec    */
      --ink:  #07070F;
      --t0:   #F0F0FF;
      --t1:   #A0A0C0;
      --mono: 'JetBrains Mono', 'Consolas', monospace;
      --sans: 'Outfit', 'Segoe UI', sans-serif;
    }

    html, body {
      width: 100%; height: 100%;
      background: transparent;
      overflow: hidden;
      -webkit-app-region: no-drag;
      user-select: none;
    }

    #hud {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100%; height: 100%;
      pointer-events: none;
    }

    /* ── Pill container ──────────────────────────────────────────── */
    .pill {
      background: rgba(7,7,15,0.92);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 9999px;
      padding: 0 20px;
      height: 44px;
      display: flex;
      align-items: center;
      gap: 10px;
      font-family: var(--sans);
      color: var(--t0);
      font-size: 13px;
      transition: opacity 0.3s ease, height 0.2s ease;
      pointer-events: all;
      min-width: 200px;
      max-width: 360px;
    }

    .pill.fade { opacity: 0.3; }

    /* ── Dot indicators ──────────────────────────────────────────── */
    .dot {
      width: 8px; height: 8px; border-radius: 50%;
      flex-shrink: 0;
      animation: pulse 1.4s ease-in-out infinite;
    }
    .dot.blue  { background: var(--a); }
    .dot.red   { background: var(--r); }
    .dot.green { background: var(--g); animation: none; }
    .dot.amber { background: var(--am); }

    @keyframes pulse {
      0%, 100% { transform: scale(1); opacity: 1; }
      50%       { transform: scale(1.3); opacity: 0.7; }
    }

    /* ── Spinner ─────────────────────────────────────────────────── */
    .spinner {
      width: 14px; height: 14px; flex-shrink: 0;
      border: 2px solid rgba(255,255,255,0.15);
      border-top-color: var(--a);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* ── Waveform ────────────────────────────────────────────────── */
    .waveform {
      display: flex; gap: 3px; align-items: center; flex-shrink: 0;
    }
    .waveform .bar {
      width: 3px; border-radius: 2px; background: var(--a);
      animation: wave 0.8s ease-in-out infinite;
    }
    .waveform .bar:nth-child(1) { height: 8px;  animation-delay: 0s; }
    .waveform .bar:nth-child(2) { height: 14px; animation-delay: 0.1s; }
    .waveform .bar:nth-child(3) { height: 20px; animation-delay: 0.2s; }
    .waveform .bar:nth-child(4) { height: 14px; animation-delay: 0.3s; }
    .waveform .bar:nth-child(5) { height: 8px;  animation-delay: 0.4s; }
    .waveform.amber .bar { background: var(--am); }

    @keyframes wave {
      0%, 100% { transform: scaleY(0.4); }
      50%       { transform: scaleY(1.0); }
    }

    /* ── Timer ───────────────────────────────────────────────────── */
    .timer { font-family: var(--mono); font-size: 11px; color: var(--t1); }

    /* ── Label ───────────────────────────────────────────────────── */
    .label { font-size: 12px; color: var(--t1); white-space: nowrap; }

    /* ── Text preview (typed state) ─────────────────────────────── */
    .preview {
      font-size: 12px; color: var(--t0);
      overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
      max-width: 220px;
    }

    /* ── Undo button ─────────────────────────────────────────────── */
    .undo-btn {
      background: rgba(255,255,255,0.08);
      border: 1px solid rgba(255,255,255,0.15);
      border-radius: 6px;
      color: var(--t0);
      font-size: 11px;
      padding: 3px 9px;
      cursor: pointer;
      font-family: var(--sans);
      pointer-events: all;
      flex-shrink: 0;
    }
    .undo-btn:hover { background: rgba(255,255,255,0.16); }

    /* ── Error ───────────────────────────────────────────────────── */
    .pill.error-state { border-color: rgba(255,71,87,0.4); }
    .error-msg { font-size: 12px; color: var(--r); max-width: 240px; overflow: hidden; text-overflow: ellipsis; }

    /* ── Hotkey hint (idle) ──────────────────────────────────────── */
    .hint {
      display: flex; gap: 12px;
    }
    .kbd {
      background: rgba(255,255,255,0.08);
      border: 1px solid rgba(255,255,255,0.15);
      border-radius: 5px;
      padding: 2px 7px;
      font-family: var(--mono); font-size: 11px;
      color: var(--t1);
    }
  </style>
</head>
<body>
  <div id="hud">
    <!-- Content is injected by overlay.js based on state -->
  </div>
  <script src="overlay.js"></script>
</body>
</html>
